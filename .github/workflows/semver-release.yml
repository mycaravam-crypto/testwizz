name: SemVer release
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: semver-release
  cancel-in-progress: false
jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify SemVer policy
        run: bash .github/scripts/semver-next.test.sh
      - name: Determine next release
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)
          if [[ -n "$latest" ]] && git merge-base --is-ancestor "$RELEASE_SHA" "$latest"; then
            echo "Already covered by $latest"
            exit 0
          fi
          version=$(bash .github/scripts/semver-next.sh "$latest" "$LABELS" "0.1.0")
          [[ -n "$version" ]] || exit 0
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.value != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        if: steps.version.outputs.value != ''
        with:
          node-version: 22
      - name: Validate release and package
        if: steps.version.outputs.value != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm install --prefix fixtures/vue --no-audit --no-fund
          dotnet restore
          dotnet build -c Release --no-restore -p:Version="$VERSION"
          dotnet test -c Release --no-build -p:Version="$VERSION"
          dotnet pack src/TestWizz.Cli -c Release --no-build -p:Version="$VERSION" -o artifacts
          test -f "artifacts/TestWizz.$VERSION.nupkg"
      - name: Create immutable tag and release
        if: steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi
          git tag "$tag" "$RELEASE_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag" "artifacts/TestWizz.$VERSION.nupkg"
