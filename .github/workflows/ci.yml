name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --prefix fixtures/vue --no-audit --no-fund
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
        env:
          # The hosted runner has Docker; this enables the real-container tests for `testwizz run`.
          TESTWIZZ_DOCKER_TESTS: 1
      - run: bash .github/scripts/semver-next.test.sh
      - run: dotnet pack src/TestWizz.Cli --no-build -c Release -o artifacts
      - name: Verify Git-derived package version
        run: |
          ls -la artifacts/*.nupkg
          if git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD >/dev/null 2>&1; then
            echo 'Tagged build: release version expected'
          else
            if find artifacts -name 'TestWizz.*-dev.*.nupkg' | grep -q .; then
              echo 'Git-derived dev package detected'
            else
              echo 'Expected Git-derived dev version for untagged checkout' >&2
              exit 1
            fi
          fi
