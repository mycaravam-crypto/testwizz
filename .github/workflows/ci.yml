name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --prefix fixtures/vue --no-audit --no-fund
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
        env:
          # The hosted runner has Docker; this enables the real-container tests for `testwizz run`.
          TESTWIZZ_DOCKER_TESTS: 1
      - run: dotnet pack src/TestWizz.Cli --no-build -c Release -o artifacts
